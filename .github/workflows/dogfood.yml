name: Dogfood

on:
  pull_request:
    branches: [main, agent/dogfood-self-trace]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  self-trace:
    name: Self trace / macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/checkout@v6
        with:
          repository: frankonstone/mcucli
          path: mcucli
          token: ${{ secrets.MCU_REPOS_TOKEN }}

      - uses: actions/checkout@v6
        with:
          repository: frankonstone/mcujson
          path: mcujson
          token: ${{ secrets.MCU_REPOS_TOKEN }}

      - uses: actions/checkout@v6
        with:
          repository: frankonstone/mcutoml
          path: mcutoml
          token: ${{ secrets.MCU_REPOS_TOKEN }}

      - uses: actions/checkout@v6
        with:
          repository: frankonstone/mcutest
          path: mcutest
          token: ${{ secrets.MCU_REPOS_TOKEN }}

      - uses: actions/checkout@v6
        with:
          repository: frankonstone/mcucov
          path: mcucov
          token: ${{ secrets.MCU_REPOS_TOKEN }}

      - uses: actions/checkout@v6
        with:
          repository: frankonstone/mcucheck
          path: mcucheck
          token: ${{ secrets.MCU_REPOS_TOKEN }}

      - name: Stage sibling dependencies outside coverage source root
        shell: bash
        run: |
          deps="${RUNNER_TEMP}/mcutrace-deps"
          mkdir -p "${deps}"
          for dep in mcucli mcujson mcutoml mcutest mcucov mcucheck; do
            cp -R "${GITHUB_WORKSPACE}/${dep}" "${deps}/${dep}"
          done

      - name: Install LLVM for host tools
        shell: bash
        run: |
          if ! brew list llvm >/dev/null 2>&1; then
            brew install llvm
          fi
          if ! brew list llvm@21 >/dev/null 2>&1; then
            brew install llvm@21
          fi
          echo "LLVM_DIR=$(brew --prefix llvm)/lib/cmake/llvm" >> "$GITHUB_ENV"
          echo "Clang_DIR=$(brew --prefix llvm)/lib/cmake/clang" >> "$GITHUB_ENV"
          echo "MCUCHECK_LLVM_DIR=$(brew --prefix llvm@21)/lib/cmake/llvm" >> "$GITHUB_ENV"
          echo "MCUCHECK_CLANG_DIR=$(brew --prefix llvm@21)/lib/cmake/clang" >> "$GITHUB_ENV"

      - name: Configure mcutrace
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DMCUTRACE_MCUCLI_SOURCE_DIR=${{ runner.temp }}/mcutrace-deps/mcucli
          -DMCUTRACE_MCUJSON_SOURCE_DIR=${{ runner.temp }}/mcutrace-deps/mcujson
          -DMCUTRACE_MCUTOML_SOURCE_DIR=${{ runner.temp }}/mcutrace-deps/mcutoml
          -DMCUTRACE_MCUTEST_SOURCE_DIR=${{ runner.temp }}/mcutrace-deps/mcutest
          -DMCUTRACE_MCUCOV_SOURCE_DIR=${{ runner.temp }}/mcutrace-deps/mcucov
          -DMCUTRACE_ENABLE_MCUCOV=ON
          -DLLVM_DIR=${LLVM_DIR}
          -DClang_DIR=${Clang_DIR}

      - name: Build mcutrace
        shell: bash
        run: |
          cmake --build build --config Release --parallel
          cmake --build build --config Release --target mcucov --parallel

      - name: Configure and build mcucheck
        shell: bash
        run: |
          cmake \
            -S "${RUNNER_TEMP}/mcutrace-deps/mcucheck" \
            -B "${RUNNER_TEMP}/mcucheck-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DMCUCHECK_BUILD_TESTS=OFF \
            -DMCUCHECK_BUILD_TOOLS=ON \
            -DMCUCHECK_INSTALL=OFF \
            -DMCUCHECK_ENABLE_AUTOSAR_CPP14=OFF \
            -DMCUCHECK_ENABLE_LLM_CPP=ON \
            -DMCUCHECK_MCUCLI_SOURCE_DIR="${RUNNER_TEMP}/mcutrace-deps/mcucli" \
            -DMCUCHECK_MCUJSON_SOURCE_DIR="${RUNNER_TEMP}/mcutrace-deps/mcujson" \
            -DMCUCHECK_MCUTOML_SOURCE_DIR="${RUNNER_TEMP}/mcutrace-deps/mcutoml" \
            -DLLVM_DIR="${MCUCHECK_LLVM_DIR}" \
            -DClang_DIR="${MCUCHECK_CLANG_DIR}"
          cmake --build "${RUNNER_TEMP}/mcucheck-build" --target mcucheck --parallel

      - name: Generate per-test and coverage evidence from real executables
        shell: bash
        run: |
          mkdir -p dogfood/results
          captures=()
          test_names=(
            mcutrace_tests
            mcutrace_requirement_tests
            mcutrace_importer_tests
            mcutrace_producer_importer_tests
            mcutrace_trace_import_tests
            mcutrace_source_annotation_tests
            mcutrace_hardening_tests
            mcutrace_assembly_tests
            mcutrace_validation_tests
            mcutrace_config_tests
            mcutrace_cli_tests
            mcutrace_output_tests
            mcutrace_evidence_expectation_tests
          )

          for test_name in "${test_names[@]}"; do
            executable="build/tests/${test_name}"
            capture="dogfood/results/${test_name}.mcuv"
            result="dogfood/results/${test_name}.json"
            log="dogfood/results/${test_name}.log"
            if ! MCUTRACE_MCUCOV_CAPTURE="${capture}" "${executable}" --mcutest-machine-output > "${result}" 2> "${log}"; then
              echo "${test_name} failed" >&2
              cat "${result}" >&2 || true
              cat "${log}" >&2 || true
              exit 1
            fi
            if [[ -s "${capture}" ]]; then captures+=("${capture}"); fi
          done

          python3 - <<'PY'
          import json
          from pathlib import Path

          tests = []
          failures = 0
          for path in sorted(Path("dogfood/results").glob("mcutrace_*_tests.json")):
              document = json.loads(path.read_text())
              if document.get("format") != "mcutest-results" or document.get("version") != 1:
                  raise SystemExit(f"unexpected mcutest result format in {path}")
              for test in document.get("tests", []):
                  requirements = test.get("requirements", [])
                  if not requirements:
                      raise SystemExit(f"test has no requirement references: {test.get('name')} ({path})")
                  tests.append(test)
                  if test.get("status") == "failed":
                      failures += 1

          output = {
              "format": "mcutest-results",
              "version": 1,
              "summary": {"tests": len(tests), "failures": failures},
              "tests": tests,
          }
          Path("dogfood/tests.json").write_text(json.dumps(output, separators=(",", ":")) + "\n")
          print(f"merged {len(tests)} individual test results; failures={failures}")
          PY
          cat dogfood/tests.json

          if [[ ${#captures[@]} -eq 0 ]]; then
            echo "no mcucov captures were produced" >&2
            exit 1
          fi

          MCUCOV="build/_deps/mcucov/mcucov"
          "${MCUCOV}" merge "${captures[@]}" --output dogfood/coverage.mcuv
          "${MCUCOV}" report \
            --input dogfood/coverage.mcuv \
            --manifest build/mcucov/mcutrace_core \
            --source-root . \
            --format json \
            --output dogfood/coverage.json
          cat dogfood/coverage.json

      - name: Generate static-analysis evidence with mcucheck
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          source = Path("build/compile_commands.json")
          target = Path("dogfood/compile_commands.mcucheck.json")
          commands = json.loads(source.read_text())
          for entry in commands:
              if "arguments" in entry:
                  entry["arguments"] = [arg for arg in entry["arguments"] if arg != "-Werror"]
              elif "command" in entry:
                  parts = entry["command"].split()
                  entry["command"] = " ".join(part for part in parts if part != "-Werror")
          target.write_text(json.dumps(commands, indent=2) + "\n")
          PY

          set +e
          MCUCHECK="${RUNNER_TEMP}/mcucheck-build/mcucheck"
          "${MCUCHECK}" analyze dogfood/compile_commands.mcucheck.json \
            --project-root "${GITHUB_WORKSPACE}" \
            --config "${RUNNER_TEMP}/mcutrace-deps/mcucheck/standards/llm_cpp/config/default.toml" \
            --jobs 1 \
            --format json \
            > dogfood/mcucheck.json \
            2> dogfood/mcucheck.log
          mcucheck_rc=$?
          set -e

          echo "MCUCHECK_EXIT_CODE=${mcucheck_rc}"
          cat dogfood/mcucheck.log
          cat dogfood/mcucheck.json
          test -s dogfood/mcucheck.json

      - name: Run self trace
        shell: bash
        run: |
          set +e
          ./build/mcutrace validate \
            -r docs/requirements.md \
            -r docs/requirements-links.md \
            -r docs/requirements-hardening.md \
            -r docs/requirements-evidence.md \
            -r docs/requirements-source-annotations.md \
            --source include/mcutrace/source_annotations.hpp \
            --source include/mcutrace/config.hpp \
            --source include/mcutrace/cli.hpp \
            -a dogfood/tests.json \
            -a dogfood/build-evidence.json \
            -a dogfood/implementation-evidence.json \
            -a dogfood/coverage.json \
            -a dogfood/mcucheck.json \
            --format text > dogfood/report.txt 2> dogfood/diagnostics.txt
          rc=$?

          ./build/mcutrace validate \
            -r docs/requirements.md \
            -r docs/requirements-links.md \
            -r docs/requirements-hardening.md \
            -r docs/requirements-evidence.md \
            -r docs/requirements-source-annotations.md \
            --source include/mcutrace/source_annotations.hpp \
            --source include/mcutrace/config.hpp \
            --source include/mcutrace/cli.hpp \
            -a dogfood/tests.json \
            -a dogfood/build-evidence.json \
            -a dogfood/implementation-evidence.json \
            -a dogfood/coverage.json \
            -a dogfood/mcucheck.json \
            --format json > dogfood/report.json 2>> dogfood/diagnostics.txt
          json_rc=$?

          echo "MCUTRACE_EXIT_CODE=${rc}"
          echo "MCUTRACE_JSON_EXIT_CODE=${json_rc}"
          echo "===== diagnostics ====="
          cat dogfood/diagnostics.txt
          echo "===== report ====="
          cat dogfood/report.txt
          echo "===== json report ====="
          cat dogfood/report.json

          if [[ ${rc} -ne 0 || ${json_rc} -ne 0 ]]; then
            exit 1
          fi

      - name: Preserve dogfood evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mcutrace-dogfood-evidence
          path: |
            dogfood/coverage.json
            dogfood/compile_commands.mcucheck.json
            dogfood/mcucheck.json
            dogfood/mcucheck.log
            dogfood/tests.json
            dogfood/report.txt
            dogfood/report.json
            dogfood/diagnostics.txt
            dogfood/results/*.json
            dogfood/results/*.log
          if-no-files-found: warn
