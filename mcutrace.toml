# Traceability inputs for the mcutrace repository itself.
#
# `./make.sh` generates every artifact declared below before it validates the
# graph and writes the VS Code hover report.

[project]
root = "."
requirements = [
  "req/mcutrace.md",
  "req/evidence.md",
  "req/hardening.md",
  "req/implementation-plans.md",
  "req/links.md",
  "req/dependencies.md",
  "req/language-server.md",
  "req/mcp-server.md",
  "req/agent-skill.md",
  "req/agent-client-integration.md",
  "req/source-annotations.md",
  "req/vscode.md",
  "req/vscode-agent-integration.md",
]
plans = ["plan/implementation-plan.md"]
sources = [
  "src/*.cpp",
  "integrations/skills/mcutrace/SKILL.md",
  "editors/vscode/agent-integration.js",
  "editors/vscode/scripts/stage-server.js",
]
build_files = ["CMakeLists.txt"]

# make.sh merges each independently runnable mcutest binary into one artifact.
[[artifacts]]
path = "build/trace/artifacts/mcutest.json"
importer = "mcutest"

[[artifacts]]
path = "build/trace/artifacts/mcucov.json"
importer = "mcucov"

[[artifacts]]
path = "build/trace/artifacts/mcucheck.json"
importer = "mcucheck"

[validation]
fail_at_or_above = "error"

# The CLI entry point is outside the instrumented mcutrace_core target.
[validation.missing_coverage]
excluded_paths = [
  "src/main.cpp",
  "integrations/skills/mcutrace/SKILL.md",
  "editors/vscode/agent-integration.js",
  "editors/vscode/scripts/stage-server.js",
]

[validation.dangling_reference]
severity = "error"

[validation.failed_test]
severity = "error"
